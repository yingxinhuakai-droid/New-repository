<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全运营指挥中心 · hqza.work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== Design Philosophy: Industrial Luminescence ===== */
/* Deep navy command center. Bright, readable data. Glassmorphism. Glowing accents. */

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  /* Deep command center palette */
  --bg:          #0a1224;
  --bg-gradient: #0f1b34;
  --panel:       rgba(20, 33, 60, 0.65);
  --panel-border: rgba(255, 255, 255, 0.08);
  --panel-glow: rgba(0, 212, 255, 0.06);
  --sidebar-bg:  rgba(8, 15, 30, 0.92);
  --sidebar-border: rgba(0, 212, 255, 0.12);
  
  /* Text - bright, readable */
  --text-primary: #e8eef7;
  --text-secondary: #9badc8;
  --text-dim:    #5f708c;
  --text-muted:  #3a4a63;
  
  /* Accent colors */
  --c-cyan:      #00d4ff;
  --c-cyan-soft: rgba(0, 212, 255, 0.15);
  --c-orange:    #ff6b35;
  --c-orange-soft: rgba(255, 107, 53, 0.15);
  --c-green:     #00e676;
  --c-green-soft: rgba(0, 230, 118, 0.15);
  --c-amber:     #ffb300;
  --c-amber-soft: rgba(255, 179, 0, 0.15);
  --c-purple:    #a78bfa;
  --c-purple-soft: rgba(167, 139, 250, 0.15);
  --c-rose:      #fb7185;
  --c-rose-soft: rgba(251, 113, 133, 0.15);
  
  /* Layout */
  --sidebar-w: 250px;
  --top-h: 72px;
  --radius-sm: 6px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-glow: 0 0 24px rgba(0, 212, 255, 0.08);
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
  
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* Animated subtle gradient background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 20% 0%, rgba(0, 133, 199, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(0, 212, 255, 0.05) 0%, transparent 40%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-gradient) 100%);
  z-index: -2;
}

/* Subtle dot grid */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
  background-size: 32px 32px;
  z-index: -1;
  pointer-events: none;
}

/* Scanline overlay */
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 212, 255, 0.015) 2px,
    rgba(0, 212, 255, 0.015) 4px
  );
  pointer-events: none;
  z-index: 1000;
}

/* ===== Layout ===== */
.layout { display: flex; min-height: 100vh; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  position: fixed;
  top: 0; left: 0; height: 100vh;
  display: flex; flex-direction: column;
  z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: transform var(--transition);
}

.sidebar-header {
  padding: 26px 24px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.sidebar-logo {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 6px;
}

.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--c-cyan), #005d8f);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 15px; font-weight: 700;
  color: #fff;
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
  letter-spacing: 0.02em;
}

.sidebar-title {
  font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  color: var(--text-primary); letter-spacing: 0.02em;
}

.sidebar-subtitle {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
  letter-spacing: 0.04em;
  margin-top: 4px;
}

.sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 0; }

.nav-item {
  display: flex; align-items: center;
  padding: 10px 22px;
  margin: 0 10px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13px;
  transition: all var(--transition-fast);
  cursor: pointer;
  border-left: 2px solid transparent;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--c-cyan-soft);
  color: var(--c-cyan);
  border-left: 2px solid var(--c-cyan);
  box-shadow: 0 0 16px rgba(0, 212, 255, 0.1);
}

.nav-item.empty {
  opacity: 0.4;
  cursor: default;
}

.nav-item.empty:hover {
  background: transparent;
  color: var(--text-secondary);
}

.nav-dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin-right: 12px; flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}

.nav-info {
  flex: 1; min-width: 0;
}

.nav-name {
  font-weight: 500;
  display: block;
  margin-bottom: 2px;
}

.nav-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-dim);
}

.nav-bar {
  height: 3px; width: 60px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px; overflow: hidden;
}

.nav-bar-fill {
  height: 100%; border-radius: 2px;
  transition: width 0.6s ease;
}

.nav-count {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-secondary);
  min-width: 28px; text-align: center;
}

.nav-item.active .nav-count {
  background: var(--c-cyan-soft);
  border-color: rgba(0, 212, 255, 0.25);
  color: var(--c-cyan);
}

.sidebar-footer {
  padding: 16px 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-dim);
}

.status-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}

.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c-green);
  box-shadow: 0 0 8px var(--c-green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--c-green); }
  50% { opacity: 0.7; box-shadow: 0 0 14px var(--c-green); }
}

/* ===== Main Content ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1; min-width: 0;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ===== Top Bar ===== */
.topbar {
  height: var(--top-h);
  background: rgba(10, 18, 36, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0, 212, 255, 0.1);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  position: sticky; top: 0; z-index: 50;
}

.topbar-title {
  display: flex; flex-direction: column;
}

.topbar-title h1 {
  font-size: 17px; font-weight: 600; color: var(--text-primary);
  letter-spacing: 0.02em;
}

.topbar-title span {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-top: 2px;
}

.topbar-center {
  display: flex; align-items: center; gap: 16px;
  flex: 1; justify-content: center; max-width: 600px;
}

.view-tabs {
  display: flex; align-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px; padding: 3px;
}

.view-tab {
  padding: 6px 16px;
  font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
  background: transparent; border: none; border-radius: 6px;
  cursor: pointer; transition: all var(--transition-fast);
  font-family: var(--font-sans);
}

.view-tab:hover { color: var(--text-primary); }

.view-tab.active {
  background: var(--c-cyan-soft);
  color: var(--c-cyan);
  box-shadow: 0 0 12px rgba(0, 212, 255, 0.1);
}

.search-wrap {
  position: relative; flex: 1; max-width: 360px;
}

.search-wrap input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  font-size: 12px; font-family: var(--font-sans);
  color: var(--text-primary);
  outline: none; transition: all var(--transition-fast);
}

.search-wrap input::placeholder { color: var(--text-dim); }

.search-wrap input:focus {
  border-color: rgba(0, 212, 255, 0.4);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.08), 0 0 16px rgba(0, 212, 255, 0.1);
}

.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim); font-size: 13px;
}

.search-clear {
  position: absolute; right: 8px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 12px; display: none;
  padding: 2px 6px; border-radius: 4px;
}

.search-clear:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }

.topbar-metrics {
  display: flex; align-items: center; gap: 24px;
}

.metric-mini {
  text-align: right;
}

.metric-mini .value {
  font-family: var(--font-mono); font-size: 22px; font-weight: 700;
  color: var(--c-cyan); line-height: 1;
}

.metric-mini .label {
  font-family: var(--font-mono); font-size: 8px; color: var(--text-dim);
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-top: 3px;
}

/* ===== Content ===== */
.content { padding: 24px 32px 40px; flex: 1; }

/* ===== Glass Card Base ===== */
.glass-card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-card);
  transition: all var(--transition);
  position: relative; overflow: hidden;
}

.glass-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  opacity: 0.6;
}

.glass-card::after {
  content: '';
  position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.03) 0%, transparent 60%);
  opacity: 0; transition: opacity var(--transition);
  pointer-events: none;
}

.glass-card:hover::after { opacity: 1; }

.card-glow {
  position: absolute; inset: -1px;
  border-radius: var(--radius); opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
}

.glass-card:hover .card-glow { opacity: 1; }

/* ===== KPI Cards ===== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  padding: 20px 22px;
  min-height: 120px;
  display: flex; flex-direction: column; justify-content: space-between;
}

.kpi-card .card-glow {
  border: 1px solid var(--accent);
  box-shadow: 0 0 24px var(--accent-soft);
}

.kpi-card .accent {
  position: absolute; top: 0; left: 20px; right: 20px; height: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.8;
}

.kpi-header {
  display: flex; align-items: center; justify-content: space-between;
}

.kpi-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  border: 1px solid;
  background: rgba(255, 255, 255, 0.03);
}

.kpi-id {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.05em;
}

.kpi-value {
  font-family: var(--font-mono); font-size: 38px; font-weight: 700;
  color: var(--text-primary); line-height: 1;
  margin: 10px 0 6px;
}

.kpi-label {
  font-size: 13px; font-weight: 500; color: var(--text-secondary);
}

.kpi-sublabel {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.05em;
}

.kpi-trend {
  font-family: var(--font-mono); font-size: 10px; color: var(--accent);
  margin-top: 8px;
}

/* ===== Dashboard Grid ===== */
.dashboard-grid {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

.chart-card {
  padding: 22px;
  min-height: 340px;
  display: flex; flex-direction: column;
}

.chart-header {
  margin-bottom: 18px;
}

.chart-header h3 {
  font-size: 15px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 3px;
}

.chart-header span {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.05em; text-transform: uppercase;
}

.chart-body {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative;
}

.distribution-ring {
  position: relative;
  width: 240px; height: 240px;
}

.distribution-ring svg {
  width: 100%; height: 100%; transform: rotate(-90deg);
}

.distribution-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.distribution-center .num {
  font-family: var(--font-mono); font-size: 42px; font-weight: 700;
  color: var(--text-primary); line-height: 1;
}

.distribution-center .txt {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-top: 4px;
}

.chart-legend {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 12px;
  margin-top: 16px;
}

.legend-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-secondary);
}

.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.legend-count {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  margin-left: auto; color: var(--text-primary);
}

/* ===== Activity Bar Chart ===== */
.activity-card {
  padding: 22px;
  min-height: 340px;
  display: flex; flex-direction: column;
}

.activity-list {
  flex: 1; display: flex; flex-direction: column; gap: 16px;
  justify-content: center;
}

.activity-row {
  display: flex; align-items: center; gap: 16px;
}

.activity-label {
  width: 80px; font-size: 13px; color: var(--text-secondary);
  text-align: right; flex-shrink: 0;
}

.activity-bar-wrap {
  flex: 1; height: 10px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 5px; overflow: hidden;
  position: relative;
}

.activity-bar {
  height: 100%; border-radius: 5px;
  position: relative;
  transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 10px currentColor;
}

.activity-bar::after {
  content: '';
  position: absolute; right: 0; top: 0; bottom: 0; width: 10px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
  border-radius: 0 5px 5px 0;
}

.activity-value {
  width: 32px; font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--text-primary); text-align: right; flex-shrink: 0;
}

/* ===== Category Module Cards ===== */
.module-section {
  margin-bottom: 28px;
}

.section-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 18px;
}

.section-icon {
  width: 14px; height: 14px; border-radius: 3px;
  transform: rotate(45deg);
  box-shadow: 0 0 12px currentColor;
}

.section-title {
  font-size: 16px; font-weight: 600; color: var(--text-primary);
}

.section-meta {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-left: auto;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.module-card {
  display: flex; flex-direction: column;
  padding: 18px 20px;
  text-decoration: none; color: inherit;
  border-left: 2px solid transparent;
  cursor: pointer;
}

.module-card:hover {
  transform: translateY(-2px);
  border-left-color: var(--accent);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), var(--panel-glow);
}

.module-card .card-glow {
  border: 1px solid var(--accent);
  box-shadow: 0 0 24px var(--accent-soft);
}

.module-top {
  display: flex; align-items: flex-start; gap: 12px;
  margin-bottom: 8px;
}

.module-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  border: 1px solid;
  background: rgba(255, 255, 255, 0.03);
}

.module-title {
  font-size: 14px; font-weight: 600; color: var(--text-primary);
  line-height: 1.4; flex: 1;
}

.module-desc {
  font-size: 12px; color: var(--text-secondary); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
}

.module-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.module-tag {
  font-size: 10px; font-family: var(--font-mono);
  padding: 3px 8px; border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-dim);
}

.module-card:hover .module-tag {
  background: var(--accent-soft);
  border-color: var(--accent-soft);
  color: var(--accent);
}

.module-arrow {
  color: var(--text-dim); font-size: 14px;
  transition: transform var(--transition-fast), color var(--transition-fast);
}

.module-card:hover .module-arrow {
  color: var(--accent); transform: translateX(3px);
}

/* ===== Empty / Loading States ===== */
.empty-state {
  text-align: center; padding: 80px 20px;
  color: var(--text-dim);
}

.empty-state .icon { font-size: 44px; margin-bottom: 16px; opacity: 0.4; }
.empty-state p { font-size: 14px; font-family: var(--font-mono); }

.no-results { display: none; text-align: center; padding: 60px 20px; }
.no-results.visible { display: block; }
.no-results .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.3; }
.no-results p { font-size: 13px; color: var(--text-dim); }

/* ===== Mobile ===== */
.mobile-toggle {
  display: none;
  position: fixed; top: 16px; left: 16px; z-index: 200;
  width: 40px; height: 40px;
  background: var(--sidebar-bg);
  border: 1px solid var(--sidebar-border);
  border-radius: 8px; cursor: pointer; padding: 0;
  align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
}

.mobile-toggle span {
  display: block; width: 18px; height: 2px;
  background: var(--text-primary); border-radius: 1px; position: relative;
}

.mobile-toggle span::before,
.mobile-toggle span::after {
  content: ''; display: block; width: 18px; height: 2px;
  background: var(--text-primary); border-radius: 1px; position: absolute; left: 0;
  transition: all 0.25s;
}

.mobile-toggle span::before { top: -6px; }
.mobile-toggle span::after { bottom: -6px; }

.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.6); z-index: 99;
  backdrop-filter: blur(4px);
}

/* ===== Responsive ===== */
@media (max-width: 1280px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .dashboard-grid { grid-template-columns: 1fr; }
}

@media (max-width: 1024px) {
  .module-grid { grid-template-columns: repeat(2, 1fr); }
  .topbar-metrics { display: none; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar { padding: 0 16px; padding-left: 60px; }
  .content { padding: 16px; }
  .kpi-grid { grid-template-columns: 1fr; }
  .module-grid { grid-template-columns: 1fr; }
  .mobile-toggle { display: flex; }
  .overlay.visible { display: block; }
  .view-tabs { display: none; }
  .topbar-center { justify-content: flex-end; }
  .search-wrap { max-width: none; }
  .topbar-title h1 { font-size: 14px; }
}

/* ===== Utility ===== */
.fade-in { animation: fadeIn 0.5s ease backwards; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-count { display: inline-block; }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="mobile-toggle" id="menuToggle" onclick="toggleSidebar()"><span></span></button>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">HQ</div>
        <div>
          <div class="sidebar-title">运营指挥中心</div>
          <div class="sidebar-subtitle">hqza.work // COMMAND CENTER</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="status-row">
        <span class="status-dot"></span>
        <span id="sidebarStatus">SYSTEM ONLINE</span>
      </div>
      <div id="sidebarMeta">44 modules · 6 categories</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <h1>安全运营指挥中心</h1>
        <span>SAFETY OPERATIONS COMMAND CENTER</span>
      </div>
      <div class="topbar-center">
        <div class="view-tabs" id="viewTabs">
          <button class="view-tab active" data-view="dashboard" onclick="setView('dashboard')">仪表盘</button>
          <button class="view-tab" data-view="list" onclick="setView('list')">分类</button>
          <button class="view-tab" data-view="all" onclick="setView('all')">全部</button>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">&#8981;</span>
        <input type="text" id="searchInput" placeholder="搜索模块 / 标签 / 分类..." oninput="handleSearch()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
      </div>
      <div class="topbar-metrics" id="topbarMetrics"></div>
    </div>

    <div class="content" id="content">
      <div class="empty-state"><div class="icon">◈</div><p>系统初始化中...</p></div>
    </div>
  </main>
</div>

<script>
// ===== Configuration =====
const CATEGORIES = [
  { id: '运营策略', cls: 'cat-op', color: 'var(--c-cyan)', soft: 'var(--c-cyan-soft)', hex: '#00d4ff', emoji: '⚙', order: 0 },
  { id: '销售支持', cls: 'cat-sl', color: 'var(--c-orange)', soft: 'var(--c-orange-soft)', hex: '#ff6b35', emoji: '◈', order: 1 },
  { id: '数据分析', cls: 'cat-sj', color: 'var(--c-green)', soft: 'var(--c-green-soft)', hex: '#00e676', emoji: '◆', order: 2 },
  { id: '引流工具', cls: 'cat-yl', color: 'var(--c-purple)', soft: 'var(--c-purple-soft)', hex: '#a78bfa', emoji: '◇', order: 3 },
  { id: '教研智课', cls: 'cat-ai', color: 'var(--c-amber)', soft: 'var(--c-amber-soft)', hex: '#ffb300', emoji: '✦', order: 4 },
  { id: '课程服务', cls: 'cat-sv', color: 'var(--c-rose)', soft: 'var(--c-rose-soft)', hex: '#fb7185', emoji: '▣', order: 5 },
];

let toolsData = [];
let currentView = 'dashboard';
let activeCategory = null;

// ===== Init =====
async function init() {
  try {
    const res = await fetch('tools.json');
    toolsData = await res.json();
    renderSidebar();
    renderTopbarMetrics();
    renderView();
    updateSidebarStatus();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state"><div class="icon">⚠</div><p>数据加载失败，请刷新重试</p></div>';
  }
}

function getCategory(id) { return CATEGORIES.find(c => c.id === id); }
function getCategoryTools(id) { return toolsData.filter(t => t.category === id); }

// ===== Animated Numbers =====
function animateNumber(el, target, duration = 1200) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (!el) return;
  const start = performance.now();
  const startVal = 0;
  function step(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.floor(startVal + (target - startVal) * eased);
    el.textContent = current.toLocaleString();
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function animatePercent(el, target, duration = 1200) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (!el) return;
  const start = performance.now();
  function step(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = (target * eased).toFixed(1);
    el.textContent = current + '%';
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ===== Sidebar =====
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const maxCount = Math.max(...CATEGORIES.map(c => getCategoryTools(c.id).length), 1);
  
  nav.innerHTML = CATEGORIES.map(cat => {
    const count = getCategoryTools(cat.id).length;
    const isActive = activeCategory === cat.id;
    const cls = (isActive ? 'active' : '') + (count === 0 ? ' empty' : '');
    const width = Math.round((count / maxCount) * 60);
    return `
      <a class="nav-item ${cls}" data-cat="${cat.id}" onclick="selectCategory('${cat.id}')">
        <span class="nav-dot" style="background:${cat.hex};color:${cat.hex}"></span>
        <span class="nav-info">
          <span class="nav-name">${cat.id}</span>
          <span class="nav-meta">
            <span class="nav-bar"><span class="nav-bar-fill" style="width:${width}px;background:${cat.hex}"></span></span>
          </span>
        </span>
        <span class="nav-count">${count}</span>
      </a>
    `;
  }).join('');
}

function updateSidebarStatus() {
  const total = toolsData.length;
  document.getElementById('sidebarMeta').textContent =
    `${total} modules · ${CATEGORIES.filter(c => getCategoryTools(c.id).length > 0).length} categories`;
}

// ===== Topbar Metrics =====
function renderTopbarMetrics() {
  const total = toolsData.length;
  const cats = CATEGORIES.filter(c => getCategoryTools(c.id).length > 0).length;
  const topCat = CATEGORIES.reduce((a, b) => getCategoryTools(a.id).length > getCategoryTools(b.id).length ? a : b);
  
  document.getElementById('topbarMetrics').innerHTML = `
    <div class="metric-mini">
      <div class="value" id="tbTotal">0</div>
      <div class="label">TOTAL MODULES</div>
    </div>
    <div class="metric-mini">
      <div class="value" id="tbCats" style="color:var(--c-green)">0</div>
      <div class="label">CATEGORIES</div>
    </div>
    <div class="metric-mini">
      <div class="value" id="tbTop" style="color:${topCat.color}">${topCat.id}</div>
      <div class="label">TOP CATEGORY</div>
    </div>
  `;
  
  setTimeout(() => {
    animateNumber('tbTotal', total, 1000);
    animateNumber('tbCats', cats, 1000);
  }, 100);
}

// ===== View Switching =====
function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  if (view !== 'list') activeCategory = null;
  renderSidebar();
  renderView();
}

function selectCategory(catId) {
  if (getCategoryTools(catId).length === 0) return;
  activeCategory = activeCategory === catId ? null : catId;
  currentView = activeCategory ? 'list' : 'dashboard';
  document.querySelectorAll('.view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === currentView);
  });
  renderSidebar();
  renderView();
  if (activeCategory) {
    setTimeout(() => {
      const el = document.getElementById('cat-' + catId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
  if (window.innerWidth <= 768) closeSidebar();
}

function renderView() {
  if (currentView === 'dashboard') renderDashboard();
  else if (currentView === 'list') renderList();
  else renderAll();
}

// ===== Dashboard View =====
function renderDashboard() {
  const total = toolsData.length;
  const cats = CATEGORIES.filter(c => getCategoryTools(c.id).length > 0).length;
  const topCat = CATEGORIES.reduce((a, b) => getCategoryTools(a.id).length > getCategoryTools(b.id).length ? a : b);
  const topCount = getCategoryTools(topCat.id).length;
  const newest = toolsData.slice().sort((a, b) => b.id.localeCompare(a.id)).slice(0, 4);
  
  const container = document.getElementById('content');
  container.innerHTML = `
    <div class="fade-in">
      <div class="kpi-grid">
        ${kpiCard('total', 'TOTAL', total, '工具总数', '+23 this month', 'var(--c-cyan)', 'var(--c-cyan-soft)', '⚙')}
        ${kpiCard('cats', 'CATEGORIES', cats, '活跃分类', '全覆盖', 'var(--c-green)', 'var(--c-green-soft)', '◆')}
        ${kpiCard('top', 'TOP', topCount, '销售支持', '最大分类', 'var(--c-orange)', 'var(--c-orange-soft)', '◈')}
        ${kpiCard('new', 'NEW', toolsData.length, '模块总数', '持续更新', 'var(--c-purple)', 'var(--c-purple-soft)', '◇')}
      </div>
      
      <div class="dashboard-grid">
        <div class="chart-card glass-card">
          <div class="chart-header">
            <h3>分类分布</h3>
            <span>CATEGORY DISTRIBUTION</span>
          </div>
          <div class="chart-body">
            <div class="distribution-ring">
              <svg viewBox="0 0 240 240"></svg>
              <div class="distribution-center">
                <div class="num" id="ringTotal">0</div>
                <div class="txt">TOTAL</div>
              </div>
            </div>
          </div>
          <div class="chart-legend" id="chartLegend"></div>
        </div>
        
        <div class="activity-card glass-card">
          <div class="chart-header">
            <h3>模块活跃度</h3>
            <span>MODULE ACTIVITY</span>
          </div>
          <div class="activity-list" id="activityList"></div>
        </div>
      </div>
      
      <div class="module-section">
        <div class="section-header">
          <span class="section-icon" style="background:var(--c-cyan);color:var(--c-cyan)"></span>
          <span class="section-title">最近更新</span>
          <span class="section-meta">RECENT MODULES</span>
        </div>
        <div class="module-grid">
          ${newest.map(t => moduleCard(t)).join('')}
        </div>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    animateNumber('ringTotal', total, 1000);
    drawDistributionRings();
    renderActivityBars();
  }, 100);
}

function kpiCard(id, labelEn, value, labelZh, sub, color, softColor, icon) {
  return `
    <div class="kpi-card glass-card" style="--accent:${color};--accent-soft:${softColor}">
      <div class="accent"></div>
      <div class="card-glow"></div>
      <div class="kpi-header">
        <div class="kpi-icon" style="color:${color};border-color:${softColor}">${icon}</div>
        <span class="kpi-id">${labelEn}</span>
      </div>
      <div class="kpi-value" id="kpi-${id}">0</div>
      <div class="kpi-label">${labelZh}</div>
      <div class="kpi-sublabel">${labelEn}</div>
      <div class="kpi-trend">${sub}</div>
    </div>
  `;
}

function drawDistributionRings() {
  const svg = document.querySelector('.distribution-ring svg');
  if (!svg) return;
  const total = toolsData.length;
  const maxRadius = 110;
  const minRadius = 50;
  const thickness = 8;
  
  CATEGORIES.filter(c => getCategoryTools(c.id).length > 0).forEach((cat, i) => {
    const count = getCategoryTools(cat.id).length;
    const radius = maxRadius - i * 12;
    const circumference = 2 * Math.PI * radius;
    const dash = (count / total) * circumference;
    const gap = circumference - dash;
    
    svg.innerHTML += `
      <circle cx="120" cy="120" r="${radius}"
        fill="none" stroke="${cat.hex}" stroke-width="${thickness}"
        stroke-dasharray="${dash} ${gap}" stroke-dashoffset="0"
        stroke-linecap="round"
        style="filter: drop-shadow(0 0 6px ${cat.hex});">
        <animate attributeName="stroke-dashoffset" from="${circumference}" to="0" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </circle>
    `;
  });
  
  // Legend
  const legend = document.getElementById('chartLegend');
  if (legend) {
    legend.innerHTML = CATEGORIES.filter(c => getCategoryTools(c.id).length > 0).map(cat => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${cat.hex};box-shadow:0 0 8px ${cat.hex}"></span>
        <span>${cat.id}</span>
        <span class="legend-count">${getCategoryTools(cat.id).length}</span>
      </div>
    `).join('');
  }
}

function renderActivityBars() {
  const list = document.getElementById('activityList');
  if (!list) return;
  const maxCount = Math.max(...CATEGORIES.map(c => getCategoryTools(c.id).length), 1);
  
  list.innerHTML = CATEGORIES.slice().sort((a, b) => getCategoryTools(b.id).length - getCategoryTools(a.id).length).map(cat => {
    const count = getCategoryTools(cat.id).length;
    const pct = (count / maxCount) * 100;
    return `
      <div class="activity-row">
        <span class="activity-label">${cat.id}</span>
        <div class="activity-bar-wrap">
          <div class="activity-bar" style="width:0%;background:linear-gradient(90deg, ${cat.hex}88, ${cat.hex});color:${cat.hex}"></div>
        </div>
        <span class="activity-value" style="color:${count > 0 ? cat.hex : 'var(--text-dim)'}">${count}</span>
      </div>
    `;
  }).join('');
  
  setTimeout(() => {
    list.querySelectorAll('.activity-bar').forEach((bar, i) => {
      const cat = CATEGORIES.slice().sort((a, b) => getCategoryTools(b.id).length - getCategoryTools(a.id).length)[i];
      const count = getCategoryTools(cat.id).length;
      const max = Math.max(...CATEGORIES.map(c => getCategoryTools(c.id).length), 1);
      bar.style.width = (count / max * 100) + '%';
    });
  }, 100);
}

// ===== List View =====
function renderList() {
  const container = document.getElementById('content');
  const catsToShow = activeCategory ? [getCategory(activeCategory)] : CATEGORIES.filter(c => getCategoryTools(c.id).length > 0);
  
  let html = '<div class="fade-in">';
  catsToShow.forEach(cat => {
    const items = getCategoryTools(cat.id);
    html += `
      <section class="module-section" id="cat-${cat.id}">
        <div class="section-header">
          <span class="section-icon" style="background:${cat.hex};color:${cat.hex}"></span>
          <span class="section-title">${cat.id}</span>
          <span class="section-meta">${items.length} MODULE${items.length > 1 ? 'S' : ''}</span>
        </div>
        <div class="module-grid">
          ${items.map(t => moduleCard(t)).join('')}
        </div>
      </section>
    `;
  });
  html += '</div>';
  container.innerHTML = html;
}

// ===== All View =====
function renderAll() {
  const container = document.getElementById('content');
  container.innerHTML = `
    <div class="fade-in">
      <div class="module-section">
        <div class="section-header">
          <span class="section-icon" style="background:var(--c-cyan);color:var(--c-cyan)"></span>
          <span class="section-title">全部模块</span>
          <span class="section-meta">${toolsData.length} MODULES</span>
        </div>
        <div class="module-grid">
          ${toolsData.map(t => moduleCard(t)).join('')}
        </div>
      </div>
    </div>
  `;
}

// ===== Module Card =====
function moduleCard(tool) {
  const cat = getCategory(tool.category) || CATEGORIES[0];
  const tags = tool.tags ? tool.tags.slice(0, 2).map(t => `<span class="module-tag">#${t}</span>`).join('') : '';
  return `
    <a href="${tool.url}" class="module-card glass-card ${cat.cls}" style="--accent:${cat.color};--accent-soft:${cat.soft}">
      <div class="card-glow"></div>
      <div class="module-top">
        <span class="module-icon" style="color:var(--accent);border-color:var(--accent-soft)">${cat.emoji}</span>
        <span class="module-title">${tool.title}</span>
      </div>
      <div class="module-desc">${tool.desc}</div>
      <div class="module-footer">
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${tags}</div>
        <span class="module-arrow">→</span>
      </div>
    </a>
  `;
}

// ===== Search =====
function handleSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const clearBtn = document.getElementById('searchClear');
  clearBtn.style.display = query ? 'block' : 'none';
  
  if (!query) {
    activeCategory = null;
    renderSidebar();
    renderView();
    return;
  }
  
  const filtered = toolsData.filter(t =>
    t.title.toLowerCase().includes(query) ||
    t.desc.toLowerCase().includes(query) ||
    (t.tags && t.tags.some(tag => tag.toLowerCase().includes(query))) ||
    t.category.toLowerCase().includes(query) ||
    t.id.toLowerCase().includes(query)
  );
  
  currentView = 'all';
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  activeCategory = null;
  renderSidebar();
  renderSearchResults(filtered, query);
}

function renderSearchResults(results, query) {
  const container = document.getElementById('content');
  if (results.length === 0) {
    container.innerHTML = `
      <div class="no-results visible">
        <div class="icon">⌕</div>
        <p>未找到包含 "<strong>${escapeHtml(query)}</strong>" 的模块</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = `
    <div class="fade-in">
      <div class="module-section">
        <div class="section-header">
          <span class="section-icon" style="background:var(--c-cyan);color:var(--c-cyan)"></span>
          <span class="section-title">搜索结果</span>
          <span class="section-meta">${results.length} MATCHES</span>
        </div>
        <div class="module-grid">
          ${results.map(t => moduleCard(t)).join('')}
        </div>
      </div>
    </div>
  `;
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  activeCategory = null;
  renderSidebar();
  renderView();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== Sidebar Toggle =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('visible');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}

// ===== Keyboard =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.activeElement === document.getElementById('searchInput') && document.getElementById('searchInput').value) {
      clearSearch();
    } else {
      closeSidebar();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

init();
</script>
</body>
</html>
