function fmt(n) { return n.toLocaleString(); }

// ============ 概览卡片 ============
(function renderOverview() {
  const container = document.getElementById('overviewCards');
  const subjects = DATA.subjects;
  const subjList = Object.entries(subjects);
  const totalErrors = subjList.reduce((a,[,d]) => a + d.knowledge_points.reduce((s,k) => s + k.total_errors, 0), 0);

  const colors = ['#e53e3e','#dd6b20','#d69e2e','#38a169','#3182ce','#805ad5'];
  const icons = ['📋','📐','🔧','🏭','🏗️','🔩'];

  let html = `<div class="card"><div class="label">📊 总错题次数</div><div class="value red">${fmt(totalErrors)}</div><div class="sub">6月1日-26日刷题数据</div></div>`;
  html += `<div class="card"><div class="label">📝 错题总数</div><div class="value blue">600</div><div class="sub">6学科 × TOP100</div></div>`;

  subjList.forEach(([name, d], i) => {
    const errTotal = d.knowledge_points.reduce((s,k) => s + k.total_errors, 0);
    html += `<div class="card">
      <div class="label">${icons[i]} ${name}</div>
      <div class="value" style="color:${colors[i]}">${fmt(errTotal)}次</div>
      <div class="sub">${d.knowledge_points.length}个知识点 · 单选${d.single_choice_count}/多选${d.multi_choice_count}</div>
    </div>`;
  });

  container.innerHTML = html;
})();

// ============ 核心发现 ============
(function renderFindings() {
  document.getElementById('keyFindings').innerHTML = DATA.overall.key_findings.map((f, i) =>
    `<div class="cross-item"><strong>发现${i+1}：</strong>${f}</div>`
  ).join('');
})();

// ============ 各学科分析 ============
(function renderSubjects() {
  const container = document.getElementById('subjectAnalyses');
  const subjects = DATA.subjects;
  const colors = ['#e53e3e','#dd6b20','#d69e2e','#38a169','#3182ce','#805ad5'];
  let idx = 0;

  let html = '';
  for (const [name, d] of Object.entries(subjects)) {
    const color = colors[idx % colors.length];
    const errTotal = d.knowledge_points.reduce((s,k) => s + k.total_errors, 0);
    const seg = d.error_segments;

    // 学科头部
    html += `<div class="subject-header">
      <h3>${name}</h3>
      <div class="subject-stats">
        <span>错题总次数：<strong>${fmt(errTotal)}</strong></span>
        <span>知识点：<strong>${d.knowledge_points.length}个</strong></span>
        <span>单选：<strong>${d.single_choice_count}</strong> 多选：<strong>${d.multi_choice_count}</strong></span>
      </div>
    </div>`;

    // 图表行 - 柱状图 + 单选多选饼图
    const chartBarId = `chartBar_${idx}`;
    const chartPieId = `chartPie_${idx}`;

    html += `<div class="charts-row">
      <div class="chart-box">
        <h4>📊 知识点错误分布（TOP10）</h4>
        <canvas id="${chartBarId}" style="max-height:320px"></canvas>
      </div>
      <div class="chart-box">
        <h4>🎯 单选/多选占比</h4>
        <canvas id="${chartPieId}" style="max-height:200px"></canvas>
        <div class="segments" style="margin-top:16px">
          <div class="seg-item seg-high"><div class="seg-num">${seg.high_400_plus||seg['high_400+']||0}</div><div class="seg-label">高频错题<br>(400+次)</div></div>
          <div class="seg-item seg-mid"><div class="seg-num">${seg.mid_150_400||0}</div><div class="seg-label">中频错题<br>(150-400次)</div></div>
          <div class="seg-item seg-low"><div class="seg-num">${seg.low_below_150||0}</div><div class="seg-label">低频错题<br>(<150次)</div></div>
        </div>
      </div>
    </div>`;

    // TOP薄弱知识点表格
    const topKps = d.knowledge_points.slice(0, 10);
    const maxErr = topKps[0]?.total_errors || 1;

    html += `<div class="chart-box">
      <h4>🔴 知识点错误排行（全部）</h4>
      <table class="kp-table">
        <thead><tr><th style="width:40px">#</th><th>知识点</th><th style="width:80px">题数</th><th style="width:120px">总错误次数</th><th style="width:120px">平均错误/题</th><th>薄弱分析</th></tr></thead>
        <tbody>`;

    d.knowledge_points.forEach((kp, i) => {
      const rank = i < 3 ? `rank-${i+1}` : 'rank-other';
      const barW = (kp.total_errors / maxErr * 100).toFixed(0);
      html += `<tr>
        <td><span class="rank-num ${rank}">${i+1}</span></td>
        <td><strong>${kp.name}</strong></td>
        <td>${kp.count}题</td>
        <td class="bar-cell"><span class="bar-fill" style="width:${barW}%;background:${color}"></span><span class="bar-val">${fmt(kp.total_errors)}</span></td>
        <td>${fmt(kp.avg_errors)}</td>
        <td style="font-size:13px;color:#718096">${kp.weakness_analysis}</td>
      </tr>`;
    });

    html += `</tbody></table></div>`;

    // 薄弱诊断
    html += `<div class="weakness-box">
      <h4>⚠️ TOP3 薄弱环节</h4>`;
    d.top_weaknesses.forEach((w, i) => {
      html += `<div class="weakness-item">
        <div class="w-title">${i+1}. ${w}</div>
      </div>`;
    });
    html += `</div>`;

    // 教研建议
    html += `<div class="advice-box">
      <h4>💡 教研改进建议</h4>
      ${d.teaching_advice.split('\n').filter(l => l.trim()).map(l => `<p>${l}</p>`).join('')}
    </div>`;

    // 销售建议
    if (d.sales_advice) {
      html += `<div class="advice-box sales">
        <h4>💰 销售话术参考</h4>
        <p>${d.sales_advice}</p>
      </div>`;
    }

    idx++;
  }

  container.innerHTML = html;

  // 渲染图表（需要等DOM更新后再渲染）
  setTimeout(() => renderCharts(), 100);
})();

// ============ 跨学科 ============
(function renderCross() {
  document.getElementById('crossSubject').innerHTML =
    DATA.overall.cross_subject_patterns.map(p =>
      `<div class="cross-item">${p}</div>`
    ).join('');
})();

// ============ 图表渲染 ============
function renderCharts() {
  const subjects = DATA.subjects;
  const colors = ['#e53e3e','#dd6b20','#d69e2e','#38a169','#3182ce','#805ad5'];
  let idx = 0;

  for (const [name, d] of Object.entries(subjects)) {
    const color = colors[idx % colors.length];
    const chartBarId = `chartBar_${idx}`;
    const chartPieId = `chartPie_${idx}`;

    // 柱状图 - TOP10知识点
    const topKps = d.knowledge_points.slice(0, 10);
    const barCtx = document.getElementById(chartBarId);
    if (barCtx) {
      new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: topKps.map(k => k.name.length > 10 ? k.name.slice(0,10)+'...' : k.name),
          datasets: [{
            label: '总错误次数',
            data: topKps.map(k => k.total_errors),
            backgroundColor: color + '99',
            borderColor: color,
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: () => topKps[0]?.name || '',
                label: (ctx) => {
                  const kp = topKps[ctx.dataIndex];
                  return [`总错误: ${fmt(kp.total_errors)}次`, `题数: ${kp.count}`, `平均: ${fmt(kp.avg_errors)}次/题`];
                }
              }
            }
          },
          scales: {
            x: { ticks: { callback: v => v >= 1000 ? (v/1000)+'k' : v } },
            y: { ticks: { font: { size: 11 } } }
          }
        }
      });
    }

    // 饼图
    const pieCtx = document.getElementById(chartPieId);
    if (pieCtx) {
      new Chart(pieCtx, {
        type: 'doughnut',
        data: {
          labels: ['单选题', '多选题'],
          datasets: [{
            data: [d.single_choice_count, d.multi_choice_count],
            backgroundColor: ['#e2e8f0', color],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    idx++;
  }
}
</script>
</body>
</html>
